name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pydantic pyyaml pytest
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t valarrp .

  # Mergen heißt veröffentlichen (Entscheidung 188): Nach grünen Tests im Standard-Branch kommt das Abbild nach
  # ghcr.io, für Synologys mit Intel/AMD und ARM. Die Synology holt es beim Neu-Erstellen des Projekts.
  publish:
    needs: [pytest, docker]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Anmelden bei ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Abbild bauen und hochladen
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/valarrp"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VALAR_VERSION="$GITHUB_SHA" --build-arg VALAR_BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$image:latest" --tag "$image:${GITHUB_SHA::12}" --push .
