# ValarRP auf der Synology (Schritt 3, Entscheidung 175). Werte in einer Datei .env daneben, siehe README.
# Der Port hängt an allen Adressen der Synology (Entscheidung 183): Heimnetz und Tailscale. Das Tailscale-Paket der
# Synology hat keine eigene Netzwerkschnittstelle; eine Bindung nur an die Adresse 100.… geht dort nicht.
# Nicht ins Internet freigeben: Es gibt keine Anmeldung.
services:
  valarrp:
    build: .
    image: valarrp
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      VALAR_HOSTS: "${VALAR_HOSTS:?erlaubte Hostnamen in .env setzen}"
    volumes:
      - ./daten:/daten
