[project]
name = "valarrp"
version = "0.1.0"
description = "Text-Rollenspiel mit Sprachmodell als Spielleiter"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
