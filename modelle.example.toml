# Einstellungen des Modell-Clients (Schritt 2a, Entscheidung 153). Vorlage: kopieren nach modelle.toml.
# Hier stehen nie Schlüssel, nur der Name der Umgebungsvariable (key_env), in der der Schlüssel liegt.
# Modellnamen und Preise sind Beispiele: vor Gebrauch beim Anbieter nachsehen.
# Preise in Euro je Million Tokens; 0 heißt kostenlos und zählt nicht zum Budget.
# output: json_schema (Anbieter prüft gegen das Schema), json_object (nur gültiges JSON) oder none.

[budget]
warn_eur = 10  # ab hier eine Warnung
stop_eur = 20  # ab hier ruft der Client nichts mehr auf

# Die Anbieter werden in dieser Reihenfolge versucht. Meldet einer ein erschöpftes Kontingent (HTTP 429),
# kommt der nächste dran. Anbieter ohne Schlüssel in der Umgebung werden übersprungen.

[[provider]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-2.5-flash"
key_env = "GEMINI_API_KEY"
output = "json_schema"

[[provider]]
name = "mistral"
base_url = "https://api.mistral.ai/v1"
model = "mistral-small-latest"
key_env = "MISTRAL_API_KEY"
output = "json_schema"

[[provider]]
name = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
key_env = "DEEPSEEK_API_KEY"
input_eur_per_million = 0.13
output_eur_per_million = 0.26
output = "json_object"

