# Einstellungen des Modell-Clients (Schritt 2a, Entscheidung 153). Vorlage: kopieren nach modelle.toml.
# Hier stehen nie Schlüssel, nur der Name der Umgebungsvariable (key_env), in der der Schlüssel liegt.
# Modellnamen und Preise sind Beispiele: vor Gebrauch beim Anbieter nachsehen.
# Preise in Euro je Million Tokens; 0 heißt kostenlos und zählt nicht zum Budget.
# output: json_schema (Anbieter prüft gegen das Schema), json_object (nur gültiges JSON) oder none.

[budget]
warn_eur = 10  # ab hier eine Warnung
stop_eur = 20  # ab hier ruft der Client nichts mehr auf

# Die Anbieter werden in dieser Reihenfolge versucht. Antwortet einer nicht oder meldet er kein Guthaben, ein
# erschöpftes Kontingent oder Überlastung (HTTP 402, 429, 502, 503, 504), kommt der nächste dran, und der gestörte
# ruht 5 Minuten am Ende der Kette (Entscheidung 223). Anbieter ohne Schlüssel werden übersprungen.

# Kette nach dem Härtetest (Entscheidung 181). Gemini braucht zwei Schlüssel aus zwei Google-Projekten: einen ohne
# Abrechnung für das freie Kontingent und einen mit Abrechnung für die bezahlte Reserve.

# Zuerst bezahlt über OpenRouter (Entscheidungen 214 und 215): ein Schlüssel, unabhängig von Googles Überlastung.
# Mistral Medium wählte im Härtetest die Aktionen am treuesten. Preise mit den 5,5 % Gebühr beim Aufladen, Oktober 2026.
[[provider]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
model = "mistralai/mistral-medium-3.1"
key_env = "OPENROUTER_API_KEY"
input_eur_per_million = 0.42
output_eur_per_million = 2.11
output = "json_schema"

[[provider]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.8-flash"
key_env = "GEMINI_API_KEY"  # Projekt ohne Abrechnung: freies Kontingent, kostet nichts
output = "json_schema"

[[provider]]
name = "mistral"
base_url = "https://api.mistral.ai/v1"
model = "mistral-medium-2604"  # Mistral Medium 3.5; 3.1 (mistral-medium-2508) ist seit 31.08.2026 abgeschaltet
key_env = "MISTRAL_API_KEY"  # Plan „Experiment“, kostenlos
output = "json_schema"

# Reserve mit demselben freien Schlüssel (Entscheidung 210): antwortete schnell, als Gemini 3.8 Flash überlastet war.
# Nicht im Härtetest geprüft.
[[provider]]
name = "gemini-reserve"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3-flash-preview"
key_env = "GEMINI_API_KEY"
output = "json_schema"

[[provider]]
name = "gemini-bezahlt"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.5-flash-lite"
key_env = "GEMINI_PAID_API_KEY"  # Projekt mit Abrechnung
input_eur_per_million = 0.3  # Dollarpreis, Oktober 2026, als Euro gezählt: lieber zu hoch
output_eur_per_million = 2.5
output = "json_schema"

